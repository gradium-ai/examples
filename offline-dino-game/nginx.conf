# Hashed build files never change; everything else (the page, sw.js, the weights) is revalidated.
map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  # Behind a path prefix (gradium.ai/demos/…), a redirect must not name the internal path.
  absolute_redirect off;

  # Cross-origin isolation, which Phonon's threads need. The service worker adds these too, for
  # hosts that cannot; sending them here saves the first visit a reload.
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Cache-Control $cache_control always;

  gzip on;
  gzip_types application/javascript application/json application/wasm text/css;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

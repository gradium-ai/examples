[project]
name = "genz-translator"
version = "0.1.0"
description = "Speak normally and read your words translated into GenZ slang, live, karaoke-style. Powered by Gradium streaming STT + LLM."
requires-python = ">=3.12"
dependencies = [
    "gradium",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
# For the terminal-only reference script (genz_translator.py), which plays the
# translation back through your speakers via Gradium TTS.
terminal = ["sounddevice>=0.4.6"]

[tool.uv]
package = false
